name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Module F.2: the API suite must run against a real database, not skip.
      # The suite's `return` / `t.skip` guards key off DATABASE_URL, so a run without one
      # fails loudly (lib/api/tests/support/requireDatabase.js) instead of reporting green
      # while every database test quietly skipped.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throwaway credential for an ephemeral, network-isolated service container in a
          # single CI job. Not a secret; never reused outside this job.
          MSSQL_SA_PASSWORD: "CiOnly_Throwaway_1"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Throwaway_1' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=TrainHubCI;user=sa;password=CiOnly_Throwaway_1;trustServerCertificate=true"
      JWT_SECRET: "ci-secret-not-for-production"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # The version must be pinned here (or via "packageManager" in package.json):
      # without it pnpm/action-setup fails before any step runs, so CI never built.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install
      # Prisma Client is generated, not committed: without this every row type is
      # `any` and the API build fails with TS7006 on a clean checkout.
      - run: pnpm --filter @workspace/db run prisma:generate
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api run build
      - name: Apply schema to the CI database
        run: pnpm --filter @workspace/db run prisma:push
      - run: pnpm --filter @workspace/api run test

  frontend:
    # The frontend is NOT a member of the root pnpm workspace: it has its own
    # package.json and lockfile (frontend/pnpm-lock.yaml), so it installs on its own.
    # Before this job nothing in CI typechecked or tested it, which is how a broken
    # page component could reach main with a green build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # --ignore-workspace keeps pnpm from walking up to the root workspace and
      # installing the backend instead of the frontend.
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:ui
