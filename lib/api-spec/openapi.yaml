              properties:
                learnerId: { type: string }
                reason: { type: string, nullable: true, maxLength: 1000 }
      responses:
        "200":
          description: Updated roster after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionAttendeesResponse"
        "400": { description: learnerId required }
        "403": { description: Caller cannot manage this session's programme }
        "404": { description: Session or attendee not found in the caller's organization }
