openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TrainHub360 corporate training management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Current organization and workspace context
  - name: dashboard
    description: Programme and organization KPI summaries
  - name: learning
    description: Courses, programmes, and competency assessments
  - name: engagement
    description: Messaging, bookings, and calendar
  - name: auth
  - name: notifications
    description: In-app notification bell (scoped to the calling user)
  - name: enrolments
  - name: analytics
  - name: governance
  - name: review-credit
    description: Optional performance review credit module
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get current workspace context
      responses:
        "200":
          description: Current workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get KPI dashboard summary
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /programmes:
    get:
      operationId: listProgrammes
      tags: [learning]
      summary: List programmes visible to the current user
      responses:
        "200":
          description: Programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Programme"
    post:
      operationId: createProgramme
      tags: [learning]
      summary: Create a programme (organization staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type: { type: string }
                owner: { type: string, description: Display name; defaults to the caller }
      responses:
        "201":
          description: Created programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "403":
          description: Organization staff access required
  /courses:
    get:
      operationId: listCourses
      tags: [learning]
      summary: List courses in the active workspace
      parameters:
        - name: programmeId
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [learning]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/attempts:
    post:
      operationId: submitAssessmentAttempt
      tags: [learning]
      summary: Legacy course-level attempt (removed; use assessments/{assessmentId}/attempts)
      description: >
        Returns 410. Client-submitted scores are never accepted: competence comes from the
        applied assessment, graded on the server.
      deprecated: true
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "410":
          description: Removed. Use POST /assessments/{assessmentId}/attempts then POST /attempts/{attemptId}/submit.
    get:
      operationId: listCourseAttempts
      tags: [learning]
      summary: List the caller's assessment attempts for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attempts with score and competence
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /courses/{courseId}/evaluation-status:
    get:
      operationId: getCourseEvaluationStatus
      tags: [learning]
      summary: Whether a course-wide re-evaluation is still running (staff only)
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "pending: true while a recalculation is due or running, plus the last job"
          content:
            application/json:
              schema:
                type: object
                required: [pending, attempts, stale, lastError]
                properties:
                  pending: { type: boolean }
                  job:
                    type: [object, "null"]
                    properties:
                      id: { type: string }
                      status: { type: string }
                      attempts: { type: integer }
                      lastError: { type: [string, "null"] }
                  attempts: { type: integer }
                  stale: { type: boolean, description: The running job has lost its heartbeat }
                  lastError: { type: [string, "null"] }
        "403":
          description: Programme staff access required
  /courses/{courseId}/assessments:
    get:
      operationId: listCourseAssessments
      tags: [learning]
      summary: List assessments for a course (no correct answers; includes lock state)
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, moduleId, type, isPublished, questions, attemptCount, bestScore, remainingAttempts, locked]
                  properties:
                    id: { type: string }
                    moduleId: { type: string }
                    type: { type: string, enum: [recall, applied] }
                    title: { type: string }
                    passMark: { type: integer }
                    maxAttempts: { type: [integer, "null"] }
                    timeLimitMinutes: { type: [integer, "null"] }
                    isPublished: { type: boolean }
                    version: { type: integer }
                    publishedAt: { type: [string, "null"], format: date-time }
                    supersededAt: { type: [string, "null"], format: date-time }
                    supersedesId: { type: [string, "null"] }
                    changeKind: { type: [string, "null"], enum: [minor, new_paper, null] }
                    questions:
                      type: array
                      description: Learner responses never include correct answers, accepted answers, rubrics or option correctness.
                      items: { type: object }
                    attemptCount: { type: integer }
                    bestScore: { type: [number, "null"] }
                    remainingAttempts: { type: [integer, "null"] }
                    locked: { type: boolean }
  /assessments/{assessmentId}:
    get:
      operationId: getAssessment
      tags: [learning]
      summary: Get assessment detail (staff responses include correct answers)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Not permitted
        "404":
          description: Not found
    patch:
      operationId: updateAssessment
      tags: [learning]
      summary: Update assessment settings (title, passMark, maxAttempts, timeLimitMinutes)
      description: >
        Editing a live assessment requires confirmNewVersion: true. The edit lands in the one draft
        that supersedes the live row; the live paper stays available to learners until that draft is
        published.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                passMark: { type: integer, minimum: 0, maximum: 100 }
                maxAttempts: { type: integer, minimum: 1, nullable: true }
                timeLimitMinutes: { type: integer, minimum: 1, nullable: true }
                confirmNewVersion: { type: boolean }
      responses:
        "200":
          description: Updated assessment or the new draft that received the edit
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  version: { type: integer }
                  isPublished: { type: boolean }
                  supersedesId: { type: [string, "null"] }
                  redirectedTo: { type: string, description: Legacy alias for the new draft id }
        "409":
          description: Live assessment; requiresNewVersion is true until confirmNewVersion is sent
  /assessments/{assessmentId}/questions:
    post:
      operationId: createQuestion
      tags: [learning]
      summary: Add a question (recall must have exactly one correct answer)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, kind, options]
              properties:
                prompt: { type: string }
                kind: { type: string, enum: [single_choice, multiple_choice, true_false, short_text] }
                points: { type: integer, minimum: 1 }
                options:
                  type: array
                  items:
                    type: object
                    required: [text]
                    properties:
                      text: { type: string }
                      correct: { type: boolean }
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                type: object
  /questions/{questionId}:
    patch:
      operationId: updateQuestion
      tags: [learning]
      summary: Update a question before publication
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: deleteQuestion
      tags: [learning]
      summary: Delete a question before publication
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /assessments/{assessmentId}/publish-impact:
    get:
      operationId: getAssessmentPublishImpact
      tags: [learning]
      summary: Count the learners affected by publishing a replacement draft
      description: >
        Programme staff only. Answers for a draft that replaces a live paper in the caller's
        organization. Withdrawn enrolments are excluded.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Course-wide impact counts
          content:
            application/json:
              schema:
                type: object
                required: [enrolled, completed, notCompleted, withAttempts]
                properties:
                  enrolled: { type: integer }
                  completed: { type: integer }
                  notCompleted: { type: integer }
                  withAttempts: { type: integer }
        "400": { description: The draft does not replace a live paper }
        "403": { description: Forbidden for this programme }
        "404": { description: Draft not found in your organization }
  /assessments/{assessmentId}/publish:
    post:
      operationId: publishAssessment
      tags: [learning]
      summary: Publish an assessment (blocks further question edits)
      description: >
        A draft that replaces a live version must send changeKind: "minor" carries earlier results
        forward, "new_paper" requires a retake and notifies not-yet-completed learners. Publishing
        retires the old row in the same transaction and queues a course-wide re-evaluation.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                changeKind: { type: string, enum: [minor, new_paper] }
      responses:
        "200":
          description: Published assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  isPublished: { type: boolean }
                  publishedAt: { type: [string, "null"], format: date-time }
                  changeKind: { type: [string, "null"], enum: [minor, new_paper, null] }
        "400":
          description: Publishing problems, or changeKind missing/invalid for a replacement
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  problems: { type: array, items: { type: string } }
                  requiresChangeKind: { type: boolean }
        "409": { description: Assessment is already published }
  /assessments/{assessmentId}/discard-draft:
    post:
      operationId: discardAssessmentDraft
      tags: [learning]
      summary: Discard a draft of a live assessment (the live version is unaffected)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Draft discarded; the live version was not changed
          content:
            application/json:
              schema:
                type: object
                required: [discarded, liveVersion]
                properties:
                  discarded: { type: string }
                  liveVersion: { type: string }
        "409":
          description: Not a draft of a live version, or it already has attempts
  /assessments/{assessmentId}/attempts:
    post:
      operationId: startAssessmentAttempt
      tags: [learning]
      summary: Start an assessment attempt (questions shuffled, answers omitted)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Started attempt
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, attemptNumber, attemptsUsed, maxAttempts]
                properties:
                  attemptId: { type: string }
                  attemptNumber: { type: integer }
                  attemptsUsed: { type: integer }
                  maxAttempts: { type: integer, nullable: true }
        "403":
          description: Assessment version is superseded, not published, enrolment missing, or attempts exhausted
          content:
            application/json:
              schema:
                type: object
                properties:
                  locked: { type: boolean }
                  bestScore: { type: number, nullable: true }
                  attemptsUsed: { type: integer }
                  maxAttempts: { type: integer }
        "409":
          description: Assessment has no questions
  /assessments/{assessmentId}/attempts/reset:
    post:
      operationId: resetAssessmentAttempts
      tags: [learning]
      summary: Reset a learner's attempts on an assessment and its carried versions
      description: >
        Deletes the learner's attempts on this assessment and every earlier version carried
        forward by a minor correction, then re-evaluates the enrolment. A new paper starts a
        fresh chain and is not affected.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolmentId]
              properties:
                enrolmentId: { type: string }
      responses:
        "200":
          description: Attempts reset
          content:
            application/json:
              schema:
                type: object
                required: [assessmentId, enrolmentId, reset, chainAssessmentIds]
                properties:
                  assessmentId: { type: string }
                  enrolmentId: { type: string }
                  reset: { type: integer }
                  chainAssessmentIds:
                    type: array
                    items: { type: string }
        "400":
          description: enrolmentId is required
        "403":
          description: Caller does not manage this programme
        "404":
          description: Assessment or enrolment not found in this scope
  /attempts/{attemptId}/submit:
    post:
      operationId: submitAttemptAnswers
      tags: [learning]
      summary: Submit answers (graded server-side)
      description: >
        Objective questions are graded here, on the server. A submitted score in the body is
        ignored; there is no field for one. An applied assessment whose questions include a
        scenario or a short answer goes to status "grading" instead of being marked, and a
        trainer finishes it with POST /attempts/{attemptId}/grade.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId]
                    properties:
                      questionId: { type: string }
                      optionIds: { type: array, items: { type: string } }
                      text: { type: string }
      responses:
        "200":
          description: Grading result with per-question outcomes and competence
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Attempt already submitted
  /sessions:
    get:
      operationId: listSessions
      tags: [engagement]
      summary: List upcoming training sessions
      description: >
        Every session in the organization is listed, but joinUrl and location are only sent to
        someone who could attend: org staff, programme staff, the session's trainer, an invited
        learner, or a learner enrolled on the session's course. Everyone else gets nulls and
        canJoin=false.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: createSession
      tags: [engagement]
      summary: Schedule a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt]
              properties:
                title: { type: string }
                courseId: { type: string, nullable: true }
                programmeId: { type: string, nullable: true }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                date: { type: string, description: Fallback when startsAt is omitted }
                time: { type: string, description: Fallback when startsAt is omitted }
                mode: { type: string, enum: [online, offline], default: online }
                joinUrl: { type: string, format: uri, description: Required for online sessions }
                location: { type: string, description: Required for offline sessions }
                capacity: { type: integer, minimum: 1, nullable: true }
                trainerId: { type: string, nullable: true }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /threads:
    get:
      operationId: listMessageThreads
      tags: [engagement]
      summary: List message threads for the active workspace
      description: Stakeholders are denied. Participants and programme admins receive messages; other org staff receive metadata only.
      parameters:
        - name: programmeId
          in: query
          required: false
          schema: { type: string }
        - name: courseId
          in: query
          required: false
          schema: { type: string }
        - name: slaStatus
          in: query
          required: false
          schema: { type: string, enum: [ok, reply_pending, escalated] }
      responses:
        "200":
          description: Message threads (org staff may have metadataOnly=true and empty messages)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
        "403":
          description: Stakeholders cannot access threads
    post:
      operationId: createThread
      tags: [engagement]
      summary: Start a message thread
      description: >
        slaHours is honoured only for programme admins (including owners) and org staff. For
        everyone else the value is ignored and the thread uses the programme override, then the
        organization default, then 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, programmeId, participantIds, body]
              properties:
                subject: { type: string }
                body: { type: string }
                programmeId: { type: string }
                courseId: { type: string, nullable: true }
                slaHours: { type: integer, minimum: 1, maximum: 720, default: 24 }
                participantIds:
                  type: array
                  items: { type: string }
                urgent: { type: boolean }
      responses:
        "201":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "400":
          description: Invalid participant or programme membership
        "403":
          description: Learners may only message a programme trainer or admin
  /threads/{threadId}/messages:
    get:
      operationId: listThreadMessages
      tags: [engagement]
      summary: List messages in a thread
      description: >
        Participants, and programme admins of the thread's programme, only. Anyone else gets
        404 rather than 403, so a thread's existence is not leaked. Stakeholders are denied.
        Access is re-checked on every read, so a removed member loses it immediately.
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreadMessage"
    post:
      operationId: sendThreadMessage
      tags: [engagement]
      summary: Send a message in a thread
      description: >
        The author is taken from the token; any author or authorRole in the body is ignored.
        Escalation is cleared only when the poster holds a trainer role on that thread.
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadMessage"
  /threads/{threadId}/sla:
    patch:
      operationId: updateThreadSla
      tags: [engagement]
      summary: Set the response window for a thread
      description: >
        Programme admins of the thread's programme and org staff only. A participant who is not
        an admin gets 403; a non-participant gets 404 so thread existence is not leaked.
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slaHours]
              properties:
                slaHours: { type: integer, minimum: 1, maximum: 720 }
      responses:
        "200":
          description: Updated thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "400":
          description: slaHours not an integer between 1 and 720
        "403":
          description: Participant is not a programme admin or org staff
        "404":
          description: Thread not found
  /message-templates:
    get:
      operationId: listMessageTemplates
      tags: [engagement]
      summary: List active canned responses for the organization
      responses:
        "200":
          description: Canned responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageTemplate"
        "403":
          description: Programme staff access required
    post:
      operationId: createMessageTemplate
      tags: [engagement]
      summary: Create a canned response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateInput"
      responses:
        "201":
          description: Created canned response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "400":
          description: title and body required
        "403":
          description: Programme staff access required
  /message-templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateMessageTemplate
      tags: [engagement]
      summary: Update a canned response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageTemplateInput"
      responses:
        "200":
          description: Updated canned response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTemplate"
        "403":
          description: Programme staff access required
        "404":
          description: Template not found
    delete:
      operationId: deactivateMessageTemplate
      tags: [engagement]
      summary: Deactivate a canned response
      responses:
        "204":
          description: Deactivated
        "403":
          description: Programme staff access required
        "404":
          description: Template not found
  /bookings:
    get:
      operationId: listBookings
      tags: [engagement]
      summary: List one-to-one bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [engagement]
      summary: Book a one-to-one session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /calendar:
    get:
      operationId: listCalendarEvents
      tags: [engagement]
      summary: List the unified training calendar
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
  /review-credit/settings:
    get:
      operationId: getReviewCreditSettings
      tags: [review-credit]
      summary: Get review credit configuration
      responses:
        "200":
          description: Review credit settings
          content:
            application/json:
