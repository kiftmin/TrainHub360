  /enrolments/{enrolmentId}:
    patch:
      operationId: updateEnrolment
      tags: [enrolments]
      summary: Update enrolment (recomputes score, audit-logged)
      description: >
        Programme-scoped whitelist. Moving a completed enrolment back to "enrolled" clears its
        completion date and source and revokes any active certificate with a CERTIFICATE_REVOKED
        audit entry. Sign-off is cleared only when an effective score input really changes and the
        review-credit period is unlocked.
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolment"
    delete:
      operationId: deleteEnrolment
      tags: [enrolments]
      summary: Withdraw an enrolment (requires second-admin approval per governance)
      description: >
        Removing a learner's last grant in a programme withdraws their enrolments: the row is
        kept with status "withdrawn", withdrawnAt and withdrawnBy, so scores and history survive
        and the learner's thread access is revoked. A withdrawal is excluded from active KPIs
        and from review-credit eligibility unless an admin overrides it.
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
