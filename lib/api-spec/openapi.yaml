            name: { type: string }
            email: { type: string }
        assessment:
          type: object
          required: [id, title, type]
          properties:
            id: { type: string }
            title: { type: string }
            type: { type: string }
        course:
          type: object
          required: [id, title, programmeId]
          properties:
            id: { type: string }
            title: { type: string }
            programmeId: { type: string }
        answered: { type: integer, description: Answers already carrying a mark }
        answersStored: { type: integer }
    EmailFailure:
      type: object
      required: [id, orgId, to, subject, error, createdAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        to: { type: string }
        subject: { type: string }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    CalendarEvent:
      type: object
      required: [id, title, date, time, type, accent]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string }
        time: { type: string }
        type: { type: string }
        accent: { type: string }
        location: { type: ["string", "null"] }
        meetingLink: { type: ["string", "null"] }
    AssessmentAttemptInput:
      type: object
      required: [appliedScore, recallScore]
      properties:
        appliedScore: { type: number, minimum: 0, maximum: 100 }
        recallScore: { type: number, minimum: 0, maximum: 100 }
    AssessmentResult:
      type: object
      required: [appliedScore, recallScore, passed, competenceMet, message]
      properties:
        appliedScore: { type: number }
        recallScore: { type: number }
        passed: { type: boolean }
        competenceMet: { type: boolean }
        message: { type: string }
    ReviewCreditSettings:
      type: object
      required: [enabled, maxWeighting, assessmentWeight, timelinessWeight, applicationWeight, requireManagerSignoff, collectApplicationScores, eligibleProgrammeTypes]
      properties:
        enabled: { type: boolean }
        maxWeighting: { type: number }
        assessmentWeight: { type: number }
        timelinessWeight: { type: number }
        applicationWeight: { type: number }
        requireManagerSignoff: { type: boolean }
        collectApplicationScores: { type: boolean }
        eligibleProgrammeTypes:
          type: array
          items: { type: string }
    ReviewCreditSettingsUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        maxWeighting: { type: number }
        assessmentWeight: { type: number }
        timelinessWeight: { type: number }
        applicationWeight: { type: number }
        collectApplicationScores: { type: boolean }
        eligibleProgrammeTypes:
          type: array
          items: { type: string }

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }
    SsoRequest:
      type: object
      required: [samlAssertion]
      properties:
        samlAssertion: { type: string }
    Enrolment:
      type: object
      required: [id, learnerId, courseId, status]
      properties:
        id: { type: string }
        learnerId: { type: string }
        courseId: { type: string }
        status: { type: string }
        enrolmentScore: { type: ["number", "null"] }
        managerSignOff: { type: ["boolean", "null"] }
    EnrolmentInput:
      type: object
      required: [learnerId, courseId]
      properties:
        learnerId: { type: string }
        courseId: { type: string }
        deadlineDate: { type: ["string", "null"] }
    EnrolmentUpdate:
      type: object
      properties:
        status: { type: string }
        appliedAssessmentScore: { type: number }
        applicationScore: { type: number }
        managerSignOff: { type: boolean }
    EnrolmentScore:
      type: object
      required: [enrolmentId, score, breakdown]
      properties:
        enrolmentId: { type: string }
        score: { type: number }
        breakdown: { type: object }
    Module:
      type: object
      required: [id, courseId, title]
      properties:
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
    ModuleInput:
      type: object
      required: [courseId, title]
      properties:
        courseId: { type: string }
        title: { type: string }
    Assessment:
      type: object
      required: [id, moduleId, type]
      properties:
        id: { type: string }
        moduleId: { type: string }
        type: { type: string, enum: [recall, applied] }
    AssessmentInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [recall, applied] }
        maxScore: { type: number }
    AuditLog:
      type: object
      required: [id, action, entity, timestamp]
      properties:
        id: { type: string }
        action: { type: string }
        entity: { type: string }
        timestamp: { type: string }
    NudgeResult:
      type: object
      required: [sent]
      properties:
        sent: { type: integer }
    HelpRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        courseId: { type: string }
    HelpResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    ReviewCreditRow:
      type: object
      required: [learnerId, raw, final]
      properties:
        learnerId: { type: string }
        raw: { type: number }
        final: { type: number }
