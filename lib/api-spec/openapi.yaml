  /sessions/{sessionId}/invitable:
    get:
      operationId: listSessionInvitableLearners
      tags: [engagement]
      summary: List active organization learners who can still be invited to a session
      description: >
        Query-side filtering over all eligible learners. Results are ordered by name then id;
        pass the returned nextCursor to fetch the next page. q must be at least 2 characters.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: false
          description: Case-insensitive name/email substring; minimum 2 characters when present.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor returned by a previous page.
          schema: { type: string }
      responses:
        "200":
          description: Invitable learners, total count, next cursor and skip reasons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInvitableResponse"
        "400": { description: Invalid q, limit or cursor }
        "403": { description: Caller cannot manage this session's programme }
        "404": { description: Session not found in the caller's organization }
  /sessions/{sessionId}/remove:
    post:
      operationId: removeSessionAttendee
      tags: [engagement]
      summary: Remove an invitee or attendee and promote the next waitlisted learner
      description: >
        Records a declined RSVP instead of deleting history, audits the staff action and reuses
