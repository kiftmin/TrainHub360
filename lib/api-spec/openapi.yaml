  # --- Phase 1.7: user management (documented 2026-11-20) -----------------------------------
  /users:
    get:
      operationId: listUsers
      tags: [governance]
      summary: Directory
      description: >
        Org staff (owner/admin) get the full directory: department, job function, activation
        state, and every grant. A programme admin gets identity plus their own programmes'
        grants only - other programmes' grants and department/job function are never sent.
        Anyone else gets 403.
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Matches name or email
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Directory entries, scoped to the caller's organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DirectoryUser"
        "403":
          description: Directory access required
    post:
      operationId: createUser
      tags: [governance]
      summary: Create a user and send an activation link
      description: >
        Org staff only. The account is created with a random, unguessable password, so nobody
        can log in until the activation link is used. The activation token is never returned
        outside NODE_ENV=test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                department: { type: string }
                jobFunction: { type: string }
      responses:
        "201":
          description: Created user (activation email sent; emailSent=false when the send failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryUser"
        "400":
          description: Invalid email or missing name
        "409":
          description: Email already in use in this or another organization
  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [governance]
      summary: Rename, change details or deactivate
      description: >
        Changing an owner's own grants or active state is owner-only; an org admin attempting it
        gets 403. Deactivating the last active owner, or removing your own last org-staff role,
        is a 409. A rename only touches courses in the caller's organization, and only rows
        whose trainerId is null.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                department: { type: [string, "null"] }
                jobFunction: { type: [string, "null"] }
                isActive: { type: boolean }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryUser"
        "403":
          description: Only an owner may change an owner
        "409":
          description: Would leave the organization without an active owner, or yourself without a staff role
  /users/{userId}/org-role:
    post:
      operationId: setOrgRole
      tags: [governance]
      summary: Grant or remove an organization-wide role
      description: >
        `role: ""` removes the org-wide grant. Removing or changing an owner's role is
        owner-only (403 for an admin); removing the last owner's role is 409.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  description: owner, admin, trainer, learner, stakeholder, or "" to remove
      responses:
        "200":
          description: Updated grants
        "403":
          description: Only an owner may change an owner
        "409":
          description: Would remove the last owner, or your own last staff role
  /users/{userId}/resend-activation:
    post:
      operationId: resendActivation
      tags: [governance]
      summary: Send a fresh activation link to a user who has not activated
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Link reissued (emailSent reports the send)
        "409":
          description: The user has already activated
  # --- Phase 1: programme memberships ---------------------------------------------------------
  /programmes/{programmeId}/members/bulk-remove:
    post:
      operationId: bulkRemoveProgrammeMembers
      tags: [governance]
      summary: Remove several people at once
      description: >
        At or above the organization's bulkRemovalThreshold this creates a member_bulk delete
        request instead of removing anyone; the request needs a different approver than its
        requester.
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Removed, or a pending request was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: integer }
                  pendingRequestId: { type: [string, "null"] }
  /delete-requests:
    get:
      operationId: listDeleteRequests
      tags: [governance]
      summary: Pending destructive requests
      responses:
        "200":
          description: Requests the caller may act on
  /delete-requests/{requestId}/approve:
    post:
      operationId: approveDeleteRequest
      tags: [governance]
      summary: Approve a destructive request
      description: >
        The approver must be an admin of the target's own programme, or an org admin/owner, and
        never the requester.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved and applied
        "403":
          description: Not an admin of the target's programme, or the requester
  /delete-requests/{requestId}/reject:
    post:
      operationId: rejectDeleteRequest
      tags: [governance]
      summary: Reject a destructive request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejected
        "403":
          description: Not an admin of the target's programme, or the requester
  # --- Auth additions -------------------------------------------------------------------------
  /auth/activate:
    post:
      operationId: activateAccount
      tags: [auth]
      summary: Set a password with an activation token
      description: Single use, 7-day expiry, same password policy as reset. The token is rejected after use or expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Activated
        "400":
          description: Invalid, used or expired token, or a password that fails the policy
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a reset link
      description: Always 200, so the endpoint does not reveal which addresses exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Accepted
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password with a token
      description: Bumps tokenVersion, so every existing session for that user is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Reset
        "400":
          description: Invalid, used or expired token, or a password that fails the policy
  /readyz:
    get:
      operationId: readiness
      tags: [health]
      summary: Readiness (database reachable)
      responses:
        "200":
          description: Ready
        "503":
          description: Dependency unavailable
  # --- Sessions, jobs and notifications -------------------------------------------------------
  /sessions/{sessionId}/sync-calendar:
    post:
      operationId: syncSessionCalendar
      tags: [engagement]
      summary: Push the session to connected calendars
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync result
  /nudge/dispatch:
    post:
      operationId: dispatchNudges
      tags: [analytics]
      summary: Dispatch nudges for a learner (org staff)
      responses:
        "200":
          description: Dispatch result
  /sla/run:
    post:
      operationId: runSlaJob
      tags: [engagement]
      summary: Run the messaging SLA escalation now (org staff)
      responses:
        "200":
          description: Escalation result
  /content-lifecycle/run:
    post:
      operationId: runContentLifecycle
      tags: [learning]
      summary: Archive expired content and notify owners (org staff)
      responses:
        "200":
          description: Lifecycle result
  /certificates/check-expiry:
    post:
      operationId: checkCertificateExpiry
      tags: [learning]
      summary: Notify learners whose certificates are expiring (org staff)
      responses:
        "200":
          description: Expiry check result
  /review-credits/lock:
    post:
      operationId: lockReviewCredits
      tags: [review-credit]
      summary: Lock a review-credit period
      responses:
        "200":
          description: Locked
  # --- Organizations --------------------------------------------------------------------------
  /organizations:
    post:
      operationId: createOrganization
      tags: [governance]
      summary: Create an organization (platform administration)
      responses:
        "201":
          description: Created organization
  /organizations/{orgId}:
    patch:
      operationId: updateOrganization
      tags: [governance]
      summary: Update organization settings (org staff)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultSlaHours: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: defaultSlaHours not an integer between 1 and 720
  /organizations/{orgId}/verify-domain:
    post:
      operationId: verifyOrganizationDomain
      tags: [governance]
      summary: Verify an email domain for the organization (org staff)
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Verification result
  /organizations/{orgId}/learners/import:
    post:
      operationId: importLearners
      tags: [governance]
      summary: Bulk-import learners (org staff)
      description: Each created account gets a random password and its own activation token.
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Import report
  # --- Calendar, certificates, cohorts --------------------------------------------------------
  /calendar/connections:
    get:
      operationId: listCalendarConnections
      tags: [engagement]
      summary: Connected external calendars
      responses:
        "200":
          description: Connections
    post:
      operationId: createCalendarConnection
      tags: [engagement]
      summary: Connect an external calendar (free/busy reading)
      responses:
        "201":
          description: Connection created
  /calendar/connections/{connectionId}:
    delete:
      operationId: deleteCalendarConnection
      tags: [engagement]
      summary: Disconnect an external calendar
      parameters:
        - name: connectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disconnected
  /certificates:
    get:
      operationId: listCertificates
      tags: [learning]
      summary: Certificates the caller may see
      responses:
        "200":
          description: Certificates
  /recognitions:
    get:
      operationId: listRecognitions
      tags: [learning]
      summary: Recognitions the caller may see
      responses:
        "200":
          description: Recognitions
  /cohorts:
    get:
      operationId: listCohorts
      tags: [learning]
      summary: Cohorts
      responses:
        "200":
          description: Cohorts
    post:
      operationId: createCohort
      tags: [learning]
      summary: Create a cohort
      description: Requires a staff role on the cohort's programme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, programmeId]
              properties:
                name: { type: string }
                programmeId: { type: string }
      responses:
        "201":
          description: Created cohort
        "403":
          description: Not programme staff
  /cohorts/{cohortId}/enrol:
    post:
      operationId: enrolCohort
      tags: [learning]
      summary: Enrol a cohort's learners on a course
      parameters:
        - name: cohortId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enrolment result
  /cohorts/{cohortId}/members:
    post:
      operationId: addCohortMembers
      tags: [learning]
      summary: Add learners to a cohort
      parameters:
        - name: cohortId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cohort
  # --- Uploads --------------------------------------------------------------------------------
  /uploads/evidence:
    post:
      operationId: uploadEvidence
      tags: [learning]
      summary: Upload a learner's evidence for an external-link completion
      description: >
        Any organization member. Only an upload made here can be attached as evidence; a staff
        content upload is rejected as proof.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredFile"
        "400":
          description: Missing file, or a type outside the allowlist
        "413":
          description: Over the size limit
  /content-progress/{progressId}/evidence:
    get:
      operationId: getEvidenceFile
      tags: [learning]
      summary: Download the evidence a learner attached
      description: The uploader, or programme staff of the item's programme.
      parameters:
        - name: progressId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not the uploader or programme staff
  # --- Destructive requests, feedback and authoring -------------------------------------------
  /assessments/{assessmentId}/delete-requests:
    post:
      operationId: requestAssessmentDeletion
      tags: [governance]
      summary: Request deletion of an assessment
      description: Needs approval by an admin of the assessment's programme who is not the requester.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Pending request
  /courses/{courseId}/delete-requests:
    post:
      operationId: requestCourseDeletion
      tags: [governance]
      summary: Request deletion of a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Pending request
  /programmes/{programmeId}/delete-requests:
    post:
      operationId: requestProgrammeDeletion
      tags: [governance]
      summary: Request deletion of a programme
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Pending request
  /modules/{moduleId}/delete-requests:
    post:
      operationId: requestModuleDeletion
      tags: [governance]
      summary: Request deletion of a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Pending request
  /courses/{courseId}/feedback:
    post:
      operationId: submitCourseFeedback
      tags: [learning]
      summary: Leave course feedback (enrolled learners)
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Feedback recorded
        "403":
          description: Not enrolled
  /courses/{courseId}/modules/{moduleId}/explain:
    post:
      operationId: explainConcept
      tags: [learning]
      summary: Explain a concept in the context of the module (AI help)
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Explanation
  /courses/{courseId}:
    patch:
      operationId: updateCourse
      tags: [learning]
      summary: Edit a course
      description: trainerId takes precedence over the legacy trainer display name.
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated course
  /programmes/{programmeId}:
    patch:
      operationId: updateProgramme
      tags: [learning]
      summary: Edit a programme
      description: slaHours is a nullable override; null uses the organization default.
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                slaHours: { type: ["integer", "null"], minimum: 1, maximum: 720 }
      responses:
        "200":
          description: Updated programme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Programme"
        "400":
          description: slaHours not an integer between 1 and 720
  /modules/{moduleId}:
    patch:
      operationId: updateModule
      tags: [learning]
      summary: Edit a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated module
  /reminders/run:
    post:
      operationId: runReminders
      tags: [engagement]
      summary: Run the reminder cadence for the organization now
      description: >
        Org staff only. Evaluates the configured reminder cadence against the current clock and
        sends the session and enrolment reminders that are due. Each cadence step is logged, so
        running it twice in a row does not send the same reminder again.
      responses:
        "200":
          description: Run summary with per-category counts
          content:
            application/json:
              schema:
                type: object
  /sessions/{sessionId}:
    patch:
      operationId: updateSession
      tags: [engagement]
      summary: Edit a scheduled session
      description: >
        A correction, not a cancel-and-reinvite. Every edit bumps sequence, because a calendar
        client ignores an update whose SEQUENCE did not increase, and confirms the change to
        confirmed attendees with an updated .ics attachment.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                mode: { type: string, enum: [online, offline] }
                capacity:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: A positive whole number, or null for unlimited
                trainerId: { type: string, nullable: true }
                startsAt: { type: string, format: date-time, nullable: true }
                endsAt: { type: string, format: date-time, nullable: true }
                date: { type: string, description: "YYYY-MM-DD; interpreted in the session's timezone" }
                time: { type: string, description: "HH:MM; interpreted in the session's timezone" }
                joinUrl: { type: string, format: uri, nullable: true, description: Required for online sessions }
                location: { type: string, nullable: true, description: Required for offline sessions }
                reason: { type: string, nullable: true, maxLength: 1000, description: Optional explanation added to attendee notifications }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "400":
          description: Invalid field; online needs an https joinUrl, offline needs a location
        "403": { description: Caller cannot manage this session's programme }
        "404": { description: Session or trainer not found in the caller's organization }
  /sessions/{sessionId}/cancel:
    post:
      operationId: cancelSession
      tags: [engagement]
      summary: Cancel a scheduled session
      description: >
        Sets status to cancelled, bumps sequence and notifies confirmed attendees with a CANCEL
        .ics. Cancelling an already-cancelled session returns it unchanged.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, maxLength: 1000, description: Optional explanation added to attendee notifications }
      responses:
        "200":
          description: Cancelled session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
        "403": { description: Caller cannot manage this session's programme }
        "404": { description: Session not found in the caller's organization }
  /sessions/{sessionId}/ics:
    get:
      operationId: getSessionIcs
      tags: [engagement]
      summary: Download one session as a calendar file
      description: >
        Only for people with a right to be in the room: an invitee or attendee (waitlisted
        included), the session's trainer, or programme/org staff. A cancelled session yields a
        CANCEL file.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: iCalendar payload
          content:
            text/calendar:
              schema: { type: string }
        "403": { description: Caller is not invited to the session }
        "404": { description: Session not found in the caller's organization }
  /content-progress/pending:
    get:
      operationId: listPendingVerification
      tags: [learning]
      summary: Trainer verification queue
      description: >
        Content progress awaiting verification. Org staff see the entire organization;
        programme trainers/admins see only their own programmes; anyone else gets 403.
      responses:
        "200":
          description: Pending rows, oldest start first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingVerification"
        "403": { description: Programme staff access required }
  /bookings/trainers:
    get:
      operationId: listBookableTrainers
      tags: [engagement]
      summary: List trainers the caller may book
      description: >
        Org staff see every active trainer in the organization; a learner sees only trainers
        with a grant in a programme they are currently enrolled on (a withdrawn enrolment does
        not count). A learner with no live enrolment gets an empty list.
      responses:
        "200":
          description: Bookable trainers, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookableTrainer"
  /assessments/grading/queue:
    get:
      operationId: listGradingQueue
      tags: [learning]
      summary: Attempts awaiting a trainer's marks
      description: >
        Submitted attempts with status "grading", oldest submission first. Programme staff see
        only their own programmes; org staff see the organization; a caller with no staff grant
        gets 403. An attempt never appears before it was submitted.
      parameters:
        - name: programmeId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Grading queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GradingQueueItem"
        "403": { description: Programme staff access required }
  /attempts/{attemptId}:
    get:
      operationId: getAttempt
      tags: [learning]
      summary: Read an attempt
      description: >
        The owner sees their own answers; staff of the attempt's programme also see the answer
        key, the rubric and per-answer marks. A score exists only after grading. An attempt in
        another organization is 404; another learner's attempt is 403.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attempt detail
          content:
            application/json:
              schema:
                type: object
        "403": { description: Attempt belongs to another learner }
        "404": { description: Attempt not found in the caller's organization }
  /attempts/{attemptId}/answers:
    put:
      operationId: saveAttemptAnswers
      tags: [learning]
      summary: Save answers without submitting
      description: >
        The attempt's owner only, while status is in_progress. The time limit is enforced here
        too, so a learner cannot keep editing by never pressing submit; an expired attempt must
        be submitted to have what was entered graded.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId]
                    properties:
                      questionId: { type: string }
                      optionIds: { type: array, items: { type: string } }
                      text: { type: string }
      responses:
        "200":
          description: Saved answers and the expiry of the attempt's time limit
          content:
            application/json:
              schema:
                type: object
        "404": { description: Attempt not found }
        "409": { description: Attempt already submitted, or the time limit has passed }
    get:
      operationId: getAttemptAnswersForGrading
      tags: [learning]
      summary: Staff view of an attempt for marking
      description: >
        Requires a trainer/admin/owner grant on the attempt's programme; grading your own
        attempt is refused. Returns the answer key, the rubric and each stored answer.
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attempt with answer key and rubric
          content:
            application/json:
              schema:
                type: object
        "403": { description: Not programme staff, or the caller owns the attempt }
        "404": { description: Attempt not found in the caller's organization }
  /attempts/{attemptId}/grade:
    post:
      operationId: gradeAttempt
      tags: [learning]
      summary: Mark a queued attempt
      description: >
        Programme staff (or org staff) only, never the learner it belongs to. Every manual
        question must be marked in one call: a half-marked attempt would silently score zero for
        the rest. Accepts either { grades: [{ questionId, points, comment }] } or the builder's
        { answers: [{ answerId, pointsAwarded, comment }] }. A graded attempt is final (409).
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grades:
                  type: array
                  items:
                    type: object
                    required: [questionId, points]
                    properties:
                      questionId: { type: string }
                      points: { type: number }
                      comment: { type: string }
                answers:
                  type: array
                  items:
                    type: object
                    required: [answerId, pointsAwarded]
                    properties:
                      answerId: { type: string }
                      pointsAwarded: { type: number }
                      comment: { type: string }
      responses:
        "200":
          description: Final marks, pass/fail, competence and any certificate issued
          content:
            application/json:
              schema:
                type: object
        "400": { description: A manual question is unmarked }
        "403": { description: Not programme staff, or grading your own attempt }
        "404": { description: Attempt not found in the caller's organization }
        "409": { description: Attempt is not awaiting grading }
  /assessments/{assessmentId}/questions/order:
    put:
      operationId: reorderAssessmentQuestions
      tags: [learning]
      summary: Reorder questions in a draft assessment
      description: >
        The body must list every question in the assessment exactly once. A published assessment
        cannot be reordered (409 with requiresNewVersion); publish a new version instead.
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: New order
          content:
            application/json:
              schema:
                type: object
                required: [assessmentId, order]
                properties:
                  assessmentId: { type: string }
                  order: { type: array, items: { type: string } }
        "400": { description: ids must list every question exactly once }
        "404": { description: Assessment not found in the caller's organization }
        "409": { description: Assessment is published; requiresNewVersion }
  /enrolments/{enrolmentId}/accept-assessment-score:
    post:
      operationId: acceptAssessmentScore
      tags: [enrolments]
      summary: Accept a pending assessment result into the enrolment score
      description: >
        Programme/org staff only. Applies pendingAssessmentScore with source "assessment" only when
        an effective input really differs from the stored score; clears sign-off and notifies the
        manager only for that real change. A pending result held by a locked review-credit period is
        accepted without moving the locked score or sign-off.
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The re-evaluated enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolment"
        "403": { description: Not programme staff }
        "404": { description: Enrolment not found in the caller's organization }
        "409": { description: There is no pending assessment result }
  /enrolments/{enrolmentId}/reject-assessment-score:
    post:
      operationId: rejectAssessmentScore
      tags: [enrolments]
      summary: Discard a pending assessment result
      description: >
        Programme/org staff only. Clears pendingAssessmentScore without touching the applied score,
        stores the suppressed value in pendingRejectedScore so the same result is not re-pending,
        and audit-logs the decision. A locked-period rejection leaves sign-off intact.
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejection acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [ok, enrolmentId]
                properties:
                  ok: { type: boolean }
                  enrolmentId: { type: string }
        "403": { description: Not programme staff }
        "404": { description: Enrolment not found in the caller's organization }
        "409": { description: There is no pending assessment result }
  /email-failures:
    get:
      operationId: listEmailFailures
      tags: [governance]
      summary: List failed email sends for the organization
      description: >
        Org staff only. Newest first; a failure stays until an operator dismisses it after
        handling.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page of failures
          content:
            application/json:
              schema:
                type: object
                required: [items, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailFailure"
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { description: Org staff access required }
  /email-failures/{failureId}/dismiss:
    post:
      operationId: dismissEmailFailure
      tags: [governance]
      summary: Dismiss a handled email failure
      parameters:
        - name: failureId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Dismissed }
        "403": { description: Org staff access required }
        "404": { description: Failure not found in the caller's organization }
  /organizations/{orgId}/review-credits/export:
    get:
      operationId: exportReviewCredits
      tags: [review-credit]
      summary: Export review-credit aggregates with manager sign-off state
      description: >
        Org staff of that organization only. JSON rows include enrolment ids, manager approvals
        and lock timestamps; format=csv flattens them to learner/raw/final/signoff.
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: Review-credit export
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewCreditExportRow"
            text/csv:
              schema: { type: string }
        "403": { description: Org staff access required, or a different organization }
components:
  schemas:
    DirectoryUser:
      type: object
      required: [id, name, email, isActive, roles]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        isActive: { type: boolean }
        department: { type: [string, "null"], description: Org staff only }
        jobFunction: { type: [string, "null"], description: Org staff only }
        activatedAt: { type: [string, "null"], format: date-time, description: Org staff only }
        roles:
          type: array
          description: Org staff see every grant; a programme admin sees only their own programmes'
          items:
            type: object
            properties:
              role: { type: string }
              programmeId: { type: [string, "null"] }
              programmeName: { type: [string, "null"] }
    StoredFile:
      type: object
      required: [storedFileId, fileName, mimeType, sizeBytes, checksum, purpose]
      properties:
        storedFileId: { type: string }
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        checksum: { type: string, description: SHA-256 of the stored bytes }
        purpose: { type: string, enum: [content, evidence] }
    Notification:
      type: object
      required: [id, type, title, createdAt, readAt]
      properties:
        id: { type: string }
        userId: { type: string }
        orgId: { type: [string, "null"] }
        type: { type: string, description: e.g. session_invite, certificate_expiring }
        title: { type: string }
        body: { type: [string, "null"] }
        link: { type: [string, "null"], description: App-relative path, e.g. /calendar }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread:
          type: integer
          description: Unread count for the bell badge
    NotificationReadResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    NotificationReadAllResult:
      type: object
      required: [ok, updated]
      properties:
        ok: { type: boolean }
        updated: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Workspace:
      type: object
      required: [organization, activeProgramme, user, dataSource]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        activeProgramme:
          $ref: "#/components/schemas/Programme"
        user:
          $ref: "#/components/schemas/CurrentUser"
        dataSource:
          type: string
    Organization:
      type: object
      required: [id, name, plan, learnerCount, programmeCount]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        learnerCount: { type: integer }
        programmeCount: { type: integer }
        defaultSlaHours: { type: integer, minimum: 1, maximum: 720, default: 24 }
    CurrentUser:
      type: object
      required: [id, name, email, role, initials]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        initials: { type: string }
    Programme:
      type: object
      required: [id, name, type, status, learnerCount, courseCount, progress, owner]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string }
        learnerCount: { type: integer }
        courseCount: { type: integer }
        progress: { type: number }
        owner: { type: string }
        slaHours: { type: ["integer", "null"], minimum: 1, maximum: 720 }
    Course:
      type: object
      required: [id, title, programmeId, programmeName, category, progress, status, appliedThreshold, appliedScore, dueDate, trainer]
      properties:
        id: { type: string }
        title: { type: string }
        programmeId: { type: string }
        programmeName: { type: string }
        category: { type: string }
        progress: { type: number }
        status: { type: string }
        appliedThreshold: { type: number }
        appliedScore: { type: ["number", "null"] }
        dueDate: { type: ["string", "null"] }
        trainer: { type: string }
        duration: { type: ["string", "null"] }
    CourseInput:
      type: object
      required: [title, programmeId, category]
      properties:
        title: { type: string }
        programmeId: { type: string }
        category: { type: string }
        appliedThreshold: { type: number }
        dueDate: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [complianceHealth, completionRate, competencyRate, expiringCredentials, dropOffRate, timeToCompetency, trainerUtilization, weeklyActivity, dropOffHeatmap, expiringItems]
      properties:
        complianceHealth: { type: number }
        completionRate: { type: number }
        competencyRate: { type: number }
        expiringCredentials: { type: integer }
        dropOffRate: { type: number }
        timeToCompetency: { type: number }
        trainerUtilization: { type: number }
        weeklyActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPoint"
        dropOffHeatmap:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapPoint"
        expiringItems:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringCredential"
    ActivityPoint:
      type: object
      required: [label, active, completed]
      properties:
        label: { type: string }
        active: { type: integer }
        completed: { type: integer }
    HeatmapPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    ExpiringCredential:
      type: object
      required: [name, course, expires, status]
      properties:
        name: { type: string }
        course: { type: string }
        expires: { type: string }
        status: { type: string }
    TrainingSession:
      type: object
      required: [id, title, programme, date, time, mode, attendees, status, sequence, canJoin]
      properties:
        id: { type: string }
        title: { type: string }
        programme: { type: string }
        programmeId: { type: ["string", "null"] }
        courseId: { type: ["string", "null"] }
        trainer: { type: string }
        trainerId: { type: ["string", "null"] }
        date: { type: string, description: "YYYY-MM-DD, derived from startsAt in the session's timezone" }
        time: { type: string, description: "HH:MM, derived from startsAt in the session's timezone" }
        startsAt: { type: ["string", "null"], format: date-time }
        endsAt: { type: ["string", "null"], format: date-time }
        timezone: { type: string }
        mode: { type: string, enum: [online, offline] }
        location: { type: ["string", "null"], description: Withheld (null) from callers who cannot join }
        joinUrl: { type: ["string", "null"], description: Withheld (null) from callers who cannot join }
        videoLink: { type: ["string", "null"], description: Legacy alias for joinUrl }
        attendees: { type: integer }
        capacity: { type: ["integer", "null"], description: Null means unlimited }
        sequence: { type: integer, description: Bumped on every edit or cancellation for calendar clients }
        canJoin: { type: boolean, description: Whether this caller may see the join details }
        status: { type: string }
    SessionAttendee:
      type: object
      required: [id, rsvpId, learnerId, name, email, isActive, status, createdAt]
      properties:
        id: { type: string }
        rsvpId: { type: string }
        learnerId: { type: string }
        name: { type: string }
        email: { type: string }
        isActive: { type: boolean }
        status: { type: string, enum: [invited, confirmed, waitlisted, declined, removed] }
        respondedAt: { type: ["string", "null"], format: date-time }
        waitlistedAt: { type: ["string", "null"], format: date-time }
        removalReason: { type: ["string", "null"], maxLength: 1000 }
        removedAt: { type: ["string", "null"], format: date-time }
        removedBy: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    SessionRosterSummary:
      type: object
      required: [sessionId, capacity, attendeeCount, seatsTaken, invited, confirmed, waitlisted, declined, removed]
      properties:
        sessionId: { type: string }
        capacity: { type: ["integer", "null"], description: Null means unlimited }
        attendeeCount: { type: integer, description: Confirmed seats taken }
        seatsTaken: { type: integer }
        seatsRemaining: { type: ["integer", "null"], nullable: true }
        invited: { type: integer }
        confirmed: { type: integer }
        waitlisted: { type: integer }
        declined: { type: integer }
        removed: { type: integer, description: Removed people are shown on the roster but never count toward seats }
    SessionAttendeesResponse:
      allOf:
        - $ref: "#/components/schemas/SessionRosterSummary"
        - type: object
          required: [attendees, summary]
          properties:
            attendees:
              type: array
              items: { $ref: "#/components/schemas/SessionAttendee" }
            summary: { $ref: "#/components/schemas/SessionRosterSummary" }
    SessionInvitableLearner:
      type: object
      required: [learnerId, id, name, email, eligible, reason]
      properties:
        learnerId: { type: string }
        id: { type: string }
        name: { type: string }
        email: { type: string }
        eligible: { type: boolean, enum: [true] }
        reason: { type: ["null"] }
    SessionInvitableResponse:
      type: object
      required: [sessionId, q, limit, total, nextCursor, learners, invitable, invitableLearners, skipped]
      properties:
        sessionId: { type: string }
        q: { type: string }
        limit: { type: integer, maximum: 200 }
        total: { type: integer }
        nextCursor: { type: ["string", "null"] }
        learners:
          type: array
          items: { $ref: "#/components/schemas/SessionInvitableLearner" }
        invitable:
          type: array
          items: { $ref: "#/components/schemas/SessionInvitableLearner" }
        invitableLearners:
          type: array
          items: { $ref: "#/components/schemas/SessionInvitableLearner" }
        skipped:
          type: array
          items:
            type: object
            required: [learnerId, name, email, reason]
            properties:
              learnerId: { type: string }
              name: { type: string }
              email: { type: string }
              reason: { type: string }
    SessionInviteResult:
      type: object
      required: [sessionId, allEnrolled, selectedCount, invited, newlyInvited, skipped, skippedCount, skippedReasons, rejected, results]
      properties:
        sessionId: { type: string }
        allEnrolled: { type: boolean }
        selectedCount: { type: integer }
        invited: { type: integer }
        newlyInvited: { type: integer }
        skipped:
          type: array
          items: { type: string }
        skippedCount: { type: integer }
        skippedReasons:
          type: object
          additionalProperties: { type: string }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/SessionInviteResultRow" }
        results:
          type: array
          items: { $ref: "#/components/schemas/SessionInviteResultRow" }
    SessionInviteResultRow:
      type: object
      required: [learnerId, outcome, reason]
      properties:
        learnerId: { type: string }
        outcome: { type: string, enum: [invited, already_invited, skipped] }
        reason: { type: ["string", "null"] }
    MessageThread:
      type: object
      required: [id, subject, context, participant, programmeId, courseId, orgId, updatedAt, urgent, slaHours, isEscalated, metadataOnly, averageResponseTimeHours, slaStatus, slaState]
      properties:
        id: { type: string }
        subject: { type: string }
        context: { type: string }
        participant: { type: string }
        programmeId: { type: ["string", "null"] }
        courseId: { type: ["string", "null"] }
        course:
          type: ["object", "null"]
          properties:
            id: { type: string }
            title: { type: string }
        orgId: { type: string }
        preview: { type: string }
        updatedAt: { type: string, format: date-time }
        unread: { type: boolean }
        urgent: { type: boolean }
        slaHours: { type: integer }
        participants:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              role: { type: string }
        isEscalated: { type: boolean }
        escalatedAt: { type: ["string", "null"], format: date-time }
        lastLearnerMessageAt: { type: ["string", "null"], format: date-time }
        lastTrainerResponseAt: { type: ["string", "null"], format: date-time }
        metadataOnly: { type: boolean }
        averageResponseTimeHours: { type: ["number", "null"] }
        slaStatus: { type: string }
        slaState: { type: string, enum: [ok, reply_pending, escalated] }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ThreadMessage" }
        participants:
          type: array
          items:
            type: object
            properties:
              userId: { type: string }
              role: { type: string }
    MessageTemplateInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, maxLength: 256 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        isActive: { type: boolean }
    MessageTemplate:
      type: object
      required: [id, orgId, title, body, createdBy, isActive, createdAt, updatedAt]
      properties:
        id: { type: string }
        orgId: { type: string }
        title: { type: string }
        body: { type: string }
        createdBy: { type: string }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ThreadMessage:
      type: object
      required: [id, threadId, author, body, createdAt, urgent]
      properties:
        id: { type: string }
        threadId: { type: string }
        author: { type: string }
        body: { type: string }
        createdAt: { type: string }
        urgent: { type: boolean }
    ThreadMessageInput:
