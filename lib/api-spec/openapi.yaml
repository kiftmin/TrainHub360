openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: TrainHub360 corporate training management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workspace
    description: Current organization and workspace context
  - name: dashboard
    description: Programme and organization KPI summaries
  - name: learning
    description: Courses, programmes, and competency assessments
  - name: engagement
    description: Messaging, bookings, and calendar
  - name: auth
  - name: enrolments
  - name: analytics
  - name: governance
  - name: review-credit
    description: Optional performance review credit module
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get current workspace context
      responses:
        "200":
          description: Current workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get KPI dashboard summary
      responses:
        "200":
          description: Dashboard KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /programmes:
    get:
      operationId: listProgrammes
      tags: [learning]
      summary: List programmes visible to the current user
      responses:
        "200":
          description: Programmes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Programme"
  /courses:
    get:
      operationId: listCourses
      tags: [learning]
      summary: List courses in the active workspace
      parameters:
        - name: programmeId
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
    post:
      operationId: createCourse
      tags: [learning]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /courses/{courseId}/attempts:
    post:
      operationId: submitAssessmentAttempt
      tags: [learning]
      summary: Legacy course-level attempt (removed; use assessments/{assessmentId}/attempts)
      deprecated: true
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "410":
          description: Removed. Use POST /assessments/{assessmentId}/attempts then POST /attempts/{attemptId}/submit.
    get:
      operationId: listCourseAttempts
      tags: [learning]
      summary: List the caller's assessment attempts for a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attempts with score and competence
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /courses/{courseId}/assessments:
    get:
      operationId: listCourseAssessments
      tags: [learning]
      summary: List assessments for a course (no correct answers; includes lock state)
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /assessments/{assessmentId}:
    get:
      operationId: getAssessment
      tags: [learning]
      summary: Get assessment detail (staff responses include correct answers)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Not permitted
        "404":
          description: Not found
    patch:
      operationId: updateAssessment
      tags: [learning]
      summary: Update assessment settings (title, passMark, maxAttempts, timeLimitMinutes)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                passMark: { type: integer, minimum: 0, maximum: 100 }
                maxAttempts: { type: integer, minimum: 1 }
                timeLimitMinutes: { type: integer, minimum: 1, nullable: true }
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                type: object
  /assessments/{assessmentId}/questions:
    post:
      operationId: createQuestion
      tags: [learning]
      summary: Add a question (recall must have exactly one correct answer)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, kind, options]
              properties:
                prompt: { type: string }
                kind: { type: string, enum: [single_choice, multiple_choice, true_false, short_text] }
                points: { type: integer, minimum: 1 }
                options:
                  type: array
                  items:
                    type: object
                    required: [text]
                    properties:
                      text: { type: string }
                      correct: { type: boolean }
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                type: object
  /questions/{questionId}:
    patch:
      operationId: updateQuestion
      tags: [learning]
      summary: Update a question before publication
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: deleteQuestion
      tags: [learning]
      summary: Delete a question before publication
      parameters:
        - name: questionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /assessments/{assessmentId}/publish:
    post:
      operationId: publishAssessment
      tags: [learning]
      summary: Publish an assessment (blocks further question edits)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published assessment
          content:
            application/json:
              schema:
                type: object
  /assessments/{assessmentId}/attempts:
    post:
      operationId: startAssessmentAttempt
      tags: [learning]
      summary: Start an assessment attempt (questions shuffled, answers omitted)
      parameters:
        - name: assessmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Started attempt
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Attempts exhausted or assessment not published
  /attempts/{attemptId}/submit:
    post:
      operationId: submitAttemptAnswers
      tags: [learning]
      summary: Submit answers (graded server-side)
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [questionId]
                    properties:
                      questionId: { type: string }
                      optionIds: { type: array, items: { type: string } }
                      text: { type: string }
      responses:
        "200":
          description: Grading result with per-question outcomes and competence
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Attempt already submitted
  /sessions:
    get:
      operationId: listSessions
      tags: [engagement]
      summary: List upcoming training sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingSession"
    post:
      operationId: createSession
      tags: [engagement]
      summary: Schedule a training session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, startsAt, endsAt]
              properties:
                title: { type: string }
                courseId: { type: string, nullable: true }
                programmeId: { type: string, nullable: true }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                date: { type: string, description: Fallback when startsAt is omitted }
                time: { type: string, description: Fallback when startsAt is omitted }
                mode: { type: string, enum: [online, offline], default: online }
                joinUrl: { type: string, format: uri, description: Required for online sessions }
                location: { type: string, description: Required for offline sessions }
                capacity: { type: integer, minimum: 1, nullable: true }
                trainerId: { type: string, nullable: true }
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSession"
  /threads:
    get:
      operationId: listMessageThreads
      tags: [engagement]
      summary: List message threads for the active workspace
      description: Stakeholders are denied. Participants and programme admins receive messages; other org staff receive metadata only.
      responses:
        "200":
          description: Message threads (org staff may have metadataOnly=true and empty messages)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
        "403":
          description: Stakeholders cannot access threads
    post:
      operationId: createThread
      tags: [engagement]
      summary: Start a message thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, participantIds, body]
              properties:
                subject: { type: string }
                body: { type: string }
                programmeId: { type: string, nullable: true }
                participantIds:
                  type: array
                  items: { type: string }
                urgent: { type: boolean }
      responses:
        "201":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"
        "400":
          description: Invalid participant or programme membership
        "403":
          description: Learners may only message a programme trainer or admin
  /threads/{threadId}/messages:
    get:
      operationId: listThreadMessages
      tags: [engagement]
      summary: List messages in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThreadMessage"
    post:
      operationId: sendThreadMessage
      tags: [engagement]
      summary: Send a message in a thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadMessage"
  /bookings:
    get:
      operationId: listBookings
      tags: [engagement]
      summary: List one-to-one bookings
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [engagement]
      summary: Book a one-to-one session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /calendar:
    get:
      operationId: listCalendarEvents
      tags: [engagement]
      summary: List the unified training calendar
      responses:
        "200":
          description: Calendar events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
  /review-credit/settings:
    get:
      operationId: getReviewCreditSettings
      tags: [review-credit]
      summary: Get review credit configuration
      responses:
        "200":
          description: Review credit settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCreditSettings"
    patch:
      operationId: updateReviewCreditSettings
      tags: [review-credit]
      summary: Update review credit configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreditSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCreditSettings"
  /review-credit/export:
    get:
      operationId: exportReviewCredits
      tags: [review-credit]
      summary: Export review credit evidence as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email/password (JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: JWT tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/sso:
    post:
      operationId: ssoLogin
      tags: [auth]
      summary: SSO/SAML token exchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SsoRequest"
      responses:
        "200":
          description: JWT tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /enrolments:
    get:
      operationId: listEnrolments
      tags: [enrolments]
      summary: List enrolments
      responses:
        "200":
          description: Enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enrolment"
    post:
      operationId: createEnrolment
      tags: [enrolments]
      summary: Create enrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolment"
  /enrolments/{enrolmentId}:
    patch:
      operationId: updateEnrolment
      tags: [enrolments]
      summary: Update enrolment (recomputes score, audit-logged)
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrolmentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolment"
    delete:
      operationId: deleteEnrolment
      tags: [enrolments]
      summary: Delete enrolment (requires second-admin approval per governance)
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
  /enrolments/{enrolmentId}/score:
    get:
      operationId: getEnrolmentScore
      tags: [enrolments]
      summary: Get computed review-credit score for an enrolment
      parameters:
        - name: enrolmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrolmentScore"
  /programmes/{programmeId}/modules:
    get:
      operationId: listModules
      tags: [learning]
      summary: List modules in a programme course set
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"
    post:
      operationId: createModule
      tags: [learning]
      summary: Create module (micro-learning unit)
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Module"
  /modules/{moduleId}/assessments:
    get:
      operationId: listAssessments
      tags: [learning]
      summary: List assessments (recall vs applied)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: createAssessment
      tags: [learning]
      summary: Create assessment tagged recall|applied
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
  /kpi/summary:
    get:
      operationId: getKpiSummary
      tags: [analytics]
      summary: KPI aggregates (competencyRate, dropOff, timeToCompetency, trainerUtilization)
      responses:
        "200":
          description: KPI summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /audit/logs:
    get:
      operationId: listAuditLogs
      tags: [governance]
      summary: Query audit trail (admin only)
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
  /nudge/run:
    post:
      operationId: runNudge
      tags: [engagement]
      summary: Trigger calendar-gap nudge pass (internal)
      responses:
        "200":
          description: Nudges sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NudgeResult"
  /help/ai:
    post:
      operationId: aiHelp
      tags: [engagement]
      summary: In-context AI help stub for stuck learners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequest"
      responses:
        "200":
          description: Help answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpResponse"
  /organizations/{orgId}/review-credits:
    get:
      operationId: getReviewCredits
      tags: [review-credit]
      summary: REST export of review-credit aggregates for HRIS
      parameters:
        - name: orgId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Review credit rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewCreditRow"
  /sessions/{sessionId}/invite:
    post:
      operationId: inviteSessionParticipants
      tags: [engagement]
      summary: Invite learners (validates org and course/programme enrolment)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [learnerIds]
              properties:
                learnerIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Invite results
          content:
            application/json:
              schema:
                type: object
                properties:
                  invited: { type: integer }
                  skipped: { type: integer }
  /sessions/{sessionId}/rsvp:
    post:
      operationId: rsvpSession
      tags: [engagement]
      summary: RSVP to a session (waitlist promotion and reminders)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, declined] }
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                type: object
  /me/ical-token:
    get:
      operationId: getMyIcalToken
      tags: [engagement]
      summary: Get or create the caller's personal calendar feed token
      responses:
        "200":
          description: Calendar feed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }
  /users/{userId}/ical-token:
    post:
      operationId: regenerateUserIcalToken
      tags: [engagement]
      summary: Regenerate a user's calendar feed token (self or org admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rotated calendar feed URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }
  /calendar/feed.ics:
    get:
      operationId: getCalendarFeed
      tags: [engagement]
      summary: Personal iCalendar feed authenticated by opaque token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ICS calendar
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Invalid token
  /programmes/{programmeId}/members:
    post:
      operationId: addProgrammeMember
      tags: [programmes]
      summary: Add a member with one or more roles
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [admin, trainer, learner, stakeholder] }
                role: { type: string, enum: [admin, trainer, learner, stakeholder] }
                enrol: { type: boolean }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid role set
  /programmes/{programmeId}/members/{userId}:
    patch:
      operationId: updateProgrammeMember
      tags: [programmes]
      summary: Update member name and/or replace their full programme role set
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [admin, trainer, learner, stakeholder] }
                fromRole: { type: string }
                toRole: { type: string }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Cannot remove the last programme admin
  /modules/{moduleId}/content:
    get:
      operationId: listModuleContent
      tags: [learning]
      summary: List ordered content for a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Content items
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: createContent
      tags: [learning]
      summary: Add content to a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title]
              properties:
                type: { type: string, enum: [native, file, external_link] }
                title: { type: string }
                body: { type: string }
                url: { type: string }
                completionMode: { type: string, enum: [trainer_verified, self_report] }
                required: { type: boolean }
                storageKey: { type: string }
                fileName: { type: string }
                mimeType: { type: string }
                sizeBytes: { type: integer }
                checksum: { type: string }
      responses:
        "201":
          description: Created content
          content:
            application/json:
              schema:
                type: object
  /content/{contentId}:
    patch:
      operationId: updateContent
      tags: [learning]
      summary: Update content metadata or tutorial
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: archiveContent
      tags: [learning]
      summary: Archive content (soft delete)
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Archived
  /modules/{moduleId}/content/reorder:
    post:
      operationId: reorderContent
      tags: [learning]
      summary: Set content ordering
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentIds]
              properties:
                contentIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Reordered
  /modules/{moduleId}/content/upload:
    post:
      operationId: uploadContent
      tags: [learning]
      summary: Upload a file as base64 JSON (50MB limit, MIME/extension allowlist)
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, dataBase64]
              properties:
                fileName: { type: string }
                mimeType: { type: string }
                dataBase64: { type: string }
      responses:
        "201":
          description: Stored file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  storageKey: { type: string }
                  fileName: { type: string }
                  mimeType: { type: string }
                  sizeBytes: { type: integer }
                  checksum: { type: string }
        "413":
          description: File too large
  /courses/{courseId}/content:
    get:
      operationId: getCourseContent
      tags: [learning]
      summary: Learner view of course content with per-user progress
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Modules and content with progress
          content:
            application/json:
              schema:
                type: object
        "403":
          description: Not enrolled
  /content/{contentId}/progress:
    post:
      operationId: markContentProgress
      tags: [learning]
      summary: Mark content complete (trainer_verified items become pending_verification)
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [in_progress, completed] }
                evidenceNote: { type: string }
      responses:
        "200":
          description: Updated progress and course progress
          content:
            application/json:
              schema:
                type: object
  /content-progress/{progressId}/verify:
    post:
      operationId: verifyContentProgress
      tags: [learning]
      summary: Trainer verifies or rejects submitted evidence
      parameters:
        - name: progressId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verified: { type: boolean, default: true }
                note: { type: string }
      responses:
        "200":
          description: Verified progress
          content:
            application/json:
              schema:
                type: object
  /content/{contentId}/download:
    get:
      operationId: downloadContent
      tags: [learning]
      summary: Download a stored file (attachment, nosniff)
      parameters:
        - name: contentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not permitted
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Workspace:
      type: object
      required: [organization, activeProgramme, user, dataSource]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        activeProgramme:
          $ref: "#/components/schemas/Programme"
        user:
          $ref: "#/components/schemas/CurrentUser"
        dataSource:
          type: string
    Organization:
      type: object
      required: [id, name, plan, learnerCount, programmeCount]
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        learnerCount: { type: integer }
        programmeCount: { type: integer }
    CurrentUser:
      type: object
      required: [id, name, email, role, initials]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        initials: { type: string }
    Programme:
      type: object
      required: [id, name, type, status, learnerCount, courseCount, progress, owner]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        status: { type: string }
        learnerCount: { type: integer }
        courseCount: { type: integer }
        progress: { type: number }
        owner: { type: string }
    Course:
      type: object
      required: [id, title, programmeId, programmeName, category, progress, status, appliedThreshold, appliedScore, dueDate, trainer]
      properties:
        id: { type: string }
        title: { type: string }
        programmeId: { type: string }
        programmeName: { type: string }
        category: { type: string }
        progress: { type: number }
        status: { type: string }
        appliedThreshold: { type: number }
        appliedScore: { type: ["number", "null"] }
        dueDate: { type: ["string", "null"] }
        trainer: { type: string }
        duration: { type: ["string", "null"] }
    CourseInput:
      type: object
      required: [title, programmeId, category]
      properties:
        title: { type: string }
        programmeId: { type: string }
        category: { type: string }
        appliedThreshold: { type: number }
        dueDate: { type: ["string", "null"] }
    DashboardSummary:
      type: object
      required: [complianceHealth, completionRate, competencyRate, expiringCredentials, dropOffRate, timeToCompetency, trainerUtilization, weeklyActivity, dropOffHeatmap, expiringItems]
      properties:
        complianceHealth: { type: number }
        completionRate: { type: number }
        competencyRate: { type: number }
        expiringCredentials: { type: integer }
        dropOffRate: { type: number }
        timeToCompetency: { type: number }
        trainerUtilization: { type: number }
        weeklyActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityPoint"
        dropOffHeatmap:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapPoint"
        expiringItems:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringCredential"
    ActivityPoint:
      type: object
      required: [label, active, completed]
      properties:
        label: { type: string }
        active: { type: integer }
        completed: { type: integer }
    HeatmapPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    ExpiringCredential:
      type: object
      required: [name, course, expires, status]
      properties:
        name: { type: string }
        course: { type: string }
        expires: { type: string }
        status: { type: string }
    TrainingSession:
      type: object
      required: [id, title, programme, date, time, mode, attendees, status]
      properties:
        id: { type: string }
        title: { type: string }
        programme: { type: string }
        date: { type: string }
        time: { type: string }
        mode: { type: string }
        location: { type: ["string", "null"] }
        videoLink: { type: ["string", "null"] }
        attendees: { type: integer }
        status: { type: string }
    MessageThread:
      type: object
      required: [id, subject, context, participant, preview, updatedAt, unread, urgent]
      properties:
        id: { type: string }
        subject: { type: string }
        context: { type: string }
        participant: { type: string }
        preview: { type: string }
        updatedAt: { type: string }
        unread: { type: boolean }
        urgent: { type: boolean }
    ThreadMessage:
      type: object
      required: [id, threadId, author, body, createdAt, urgent]
      properties:
        id: { type: string }
        threadId: { type: string }
        author: { type: string }
        body: { type: string }
        createdAt: { type: string }
        urgent: { type: boolean }
    ThreadMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
        urgent: { type: boolean }
    Booking:
      type: object
      required: [id, trainer, course, date, time, duration, status]
      properties:
        id: { type: string }
        trainer: { type: string }
        course: { type: string }
        date: { type: string }
        time: { type: string }
        duration: { type: string }
        status: { type: string }
        meetingLink: { type: ["string", "null"] }
    BookingInput:
      type: object
      required: [trainer, date, time]
      properties:
        trainer: { type: string }
        course: { type: string }
        date: { type: string }
        time: { type: string }
    CalendarEvent:
      type: object
      required: [id, title, date, time, type, accent]
      properties:
        id: { type: string }
        title: { type: string }
        date: { type: string }
        time: { type: string }
        type: { type: string }
        accent: { type: string }
        location: { type: ["string", "null"] }
        meetingLink: { type: ["string", "null"] }
    AssessmentAttemptInput:
      type: object
      required: [appliedScore, recallScore]
      properties:
        appliedScore: { type: number, minimum: 0, maximum: 100 }
        recallScore: { type: number, minimum: 0, maximum: 100 }
    AssessmentResult:
      type: object
      required: [appliedScore, recallScore, passed, competenceMet, message]
      properties:
        appliedScore: { type: number }
        recallScore: { type: number }
        passed: { type: boolean }
        competenceMet: { type: boolean }
        message: { type: string }
    ReviewCreditSettings:
      type: object
      required: [enabled, maxWeighting, assessmentWeight, timelinessWeight, applicationWeight, requireManagerSignoff, collectApplicationScores, eligibleProgrammeTypes]
      properties:
        enabled: { type: boolean }
        maxWeighting: { type: number }
        assessmentWeight: { type: number }
        timelinessWeight: { type: number }
        applicationWeight: { type: number }
        requireManagerSignoff: { type: boolean }
        collectApplicationScores: { type: boolean }
        eligibleProgrammeTypes:
          type: array
          items: { type: string }
    ReviewCreditSettingsUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        maxWeighting: { type: number }
        assessmentWeight: { type: number }
        timelinessWeight: { type: number }
        applicationWeight: { type: number }
        collectApplicationScores: { type: boolean }
        eligibleProgrammeTypes:
          type: array
          items: { type: string }

    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: "#/components/schemas/CurrentUser" }
    SsoRequest:
      type: object
      required: [samlAssertion]
      properties:
        samlAssertion: { type: string }
    Enrolment:
      type: object
      required: [id, learnerId, courseId, status]
      properties:
        id: { type: string }
        learnerId: { type: string }
        courseId: { type: string }
        status: { type: string }
        enrolmentScore: { type: ["number", "null"] }
        managerSignOff: { type: ["boolean", "null"] }
    EnrolmentInput:
      type: object
      required: [learnerId, courseId]
      properties:
        learnerId: { type: string }
        courseId: { type: string }
        deadlineDate: { type: ["string", "null"] }
    EnrolmentUpdate:
      type: object
      properties:
        status: { type: string }
        appliedAssessmentScore: { type: number }
        applicationScore: { type: number }
        managerSignOff: { type: boolean }
    EnrolmentScore:
      type: object
      required: [enrolmentId, score, breakdown]
      properties:
        enrolmentId: { type: string }
        score: { type: number }
        breakdown: { type: object }
    Module:
      type: object
      required: [id, courseId, title]
      properties:
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
    ModuleInput:
      type: object
      required: [courseId, title]
      properties:
        courseId: { type: string }
        title: { type: string }
    Assessment:
      type: object
      required: [id, moduleId, type]
      properties:
        id: { type: string }
        moduleId: { type: string }
        type: { type: string, enum: [recall, applied] }
    AssessmentInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [recall, applied] }
        maxScore: { type: number }
    AuditLog:
      type: object
      required: [id, action, entity, timestamp]
      properties:
        id: { type: string }
        action: { type: string }
        entity: { type: string }
        timestamp: { type: string }
    NudgeResult:
      type: object
      required: [sent]
      properties:
        sent: { type: integer }
    HelpRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        courseId: { type: string }
    HelpResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    ReviewCreditRow:
      type: object
      required: [learnerId, raw, final]
      properties:
        learnerId: { type: string }
        raw: { type: number }
        final: { type: number }
