  /programmes/{programmeId}/members:
    get:
      operationId: listProgrammeMembers
      tags: [programmes]
      summary: List the programme's members and their roles
      description: Programme staff (admin, owner or trainer) only.
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Members with their programme-scoped grants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "403":
          description: Programme staff access required
    post:
      operationId: assignProgrammeMember
      tags: [programmes]
      summary: Add a member with one or more roles
      description: >
        Adds role grants; it never removes another grant, so a person can hold several roles in
        one programme (a Trainer who is also Programme Admin). Idempotent through the unique
        grant. A learner grant creates the enrolment, or reinstates a withdrawn one when the
        person is being re-added; that also restores thread participation they lost.
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [admin, trainer, learner, stakeholder] }
                role: { type: string, enum: [admin, trainer, learner, stakeholder] }
                enrol: { type: boolean }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Invalid role set
  /programmes/{programmeId}/members/{userId}:
    patch:
      operationId: updateProgrammeMember
      tags: [programmes]
      summary: Update member name and/or replace their full programme role set
      description: >
        `{ fromRole, toRole }` changes one named grant; `roles` replaces the whole set. No route
        may remove or change an admin grant without assertNotLastProgrammeAdmin, which returns
        409, and every multi-step change runs in one transaction.
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                roles:
                  type: array
                  items: { type: string, enum: [admin, trainer, learner, stakeholder] }
                fromRole: { type: string }
                toRole: { type: string }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Cannot remove the last programme admin
    delete:
      operationId: removeProgrammeMember
      tags: [programmes]
      summary: Remove a member from a programme
      description: >
        Deletes the member's grants in this programme, withdraws their enrolments and unassigns
        courses they trained. Their thread participation rows are soft-revoked (leftAt/leftReason)
        so the history survives and a later re-add can restore access. The last programme admin
        cannot be removed (409).
      parameters:
        - name: programmeId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed, with counts of what changed
        "409":
          description: Cannot remove the last programme admin
